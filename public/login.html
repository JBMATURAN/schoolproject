<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Computer Lab Inventory System</title>
    
    <!-- CSS Framework - Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Nunito', sans-serif;
        }
        
        .login-container {
            max-width: 400px;
            margin: 0 auto;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .login-header {
            background: linear-gradient(135deg, #4e73df, #224abe);
            color: white;
            padding: 2rem 2rem 1rem;
            border-radius: 20px 20px 0 0;
            text-align: center;
        }
        
        .login-header h3 {
            margin: 0;
            font-weight: 700;
        }
        
        .login-header p {
            margin: 0.5rem 0 0;
            opacity: 0.9;
        }
        
        .login-body {
            padding: 2rem;
        }
        
        .form-control {
            border-radius: 12px;
            border: 2px solid #e3e6f0;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #4e73df;
            box-shadow: 0 0 0 0.2rem rgba(78, 115, 223, 0.25);
        }
        
        .input-group-text {
            background: #f8f9fc;
            border: 2px solid #e3e6f0;
            border-radius: 12px 0 0 12px;
            color: #5a5c69;
        }
        
        .btn-login {
            background: linear-gradient(135deg, #4e73df, #224abe);
            border: none;
            border-radius: 12px;
            padding: 0.75rem 2rem;
            font-weight: 600;
            color: white;
            width: 100%;
            transition: all 0.3s ease;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(78, 115, 223, 0.3);
            color: white;
        }
        
        .alert {
            border-radius: 12px;
            border: none;
        }
        
        .form-check-input:checked {
            background-color: #4e73df;
            border-color: #4e73df;
        }
        
        .password-toggle {
            cursor: pointer;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
            color: #5a5c69;
        }
        
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }
        
        @media (max-width: 576px) {
            .login-container {
                margin: 1rem;
            }
            
            .login-header,
            .login-body {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <i class="bi bi-pc-display-horizontal fs-1 mb-3"></i>
                    <h3>Lab Inventory System</h3>
                    <p>Sign in to your account</p>
                </div>
                
                <div class="login-body">
                    <div id="alert-container"></div>
                    
                    <form id="login-form">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username or Email</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-person"></i>
                                </span>
                                <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group position-relative">
                                <span class="input-group-text">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                                <span class="password-toggle" onclick="togglePassword()">
                                    <i class="bi bi-eye" id="password-icon"></i>
                                </span>
                            </div>
                        </div>
                        
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember_me" name="remember_me">
                            <label class="form-check-label" for="remember_me">
                                Remember me for 30 days
                            </label>
                        </div>
                        
                        <button type="submit" class="btn btn-login">
                            <span class="login-text">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                            </span>
                            <span class="loading-text d-none">
                                <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                                Signing in...
                            </span>
                        </button>
                    </form>
                    
                    <hr class="my-4">
                    
                    <div class="text-center">
                        <small class="text-muted">
                            Demo credentials:<br>
                            <strong>Username:</strong> admin<br>
                            <strong>Password:</strong> password
                        </small>
                    </div>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <small class="text-white">
                    <i class="bi bi-shield-check me-1"></i>
                    Secure login with rate limiting and CSRF protection
                </small>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        class LoginManager {
            constructor() {
                this.form = document.getElementById('login-form');
                this.alertContainer = document.getElementById('alert-container');
                this.init();
            }
            
            init() {
                this.form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleLogin();
                });
                
                // Enter key support
                this.form.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        this.handleLogin();
                    }
                });
            }
            
            async handleLogin() {
                const formData = new FormData(this.form);
                const data = {
                    username: formData.get('username'),
                    password: formData.get('password'),
                    remember_me: formData.get('remember_me') === 'on'
                };
                
                // Validate form
                if (!data.username || !data.password) {
                    this.showAlert('Please fill in all required fields', 'danger');
                    return;
                }
                
                try {
                    this.setLoading(true);
                    this.clearAlerts();
                    
                    const response = await fetch('/api/auth.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest'
                        },
                        body: JSON.stringify(data)
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        this.showAlert('Login successful! Redirecting...', 'success');
                        
                        // Redirect after short delay
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 1500);
                    } else {
                        this.showAlert(result.message || 'Login failed', 'danger');
                    }
                    
                } catch (error) {
                    console.error('Login error:', error);
                    this.showAlert('Network error. Please try again.', 'danger');
                } finally {
                    this.setLoading(false);
                }
            }
            
            setLoading(loading) {
                const button = this.form.querySelector('button[type="submit"]');
                const loginText = button.querySelector('.login-text');
                const loadingText = button.querySelector('.loading-text');
                
                if (loading) {
                    button.disabled = true;
                    loginText.classList.add('d-none');
                    loadingText.classList.remove('d-none');
                    this.form.classList.add('loading');
                } else {
                    button.disabled = false;
                    loginText.classList.remove('d-none');
                    loadingText.classList.add('d-none');
                    this.form.classList.remove('loading');
                }
            }
            
            showAlert(message, type) {
                const alert = document.createElement('div');
                alert.className = `alert alert-${type} alert-dismissible fade show`;
                alert.innerHTML = `
                    <i class="bi bi-${type === 'success' ? 'check-circle' : 'exclamation-triangle'} me-2"></i>
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                `;
                
                this.alertContainer.appendChild(alert);
                
                // Auto-dismiss after 5 seconds
                setTimeout(() => {
                    if (alert.parentNode) {
                        alert.remove();
                    }
                }, 5000);
            }
            
            clearAlerts() {
                this.alertContainer.innerHTML = '';
            }
        }
        
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('password-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.className = 'bi bi-eye-slash';
            } else {
                passwordInput.type = 'password';
                passwordIcon.className = 'bi bi-eye';
            }
        }
        
        // Initialize login manager when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new LoginManager();
        });
        
        // Check if already logged in
        fetch('/api/auth.php?action=check')
            .then(response => response.json())
            .then(result => {
                if (result.authenticated) {
                    window.location.href = '/';
                }
            })
            .catch(error => {
                console.log('Auth check failed:', error);
            });
    </script>
</body>
</html>
